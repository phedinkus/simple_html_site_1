    <title>Nocturne — The Paper Almanac</title>

  <body class="almanac">
    <main class="sheet">
      <header class="masthead reveal">
        <a href="index.html" class="masthead__mark">The&nbsp;Paper&nbsp;<em>Almanac</em></a>
        <span class="masthead__meta">Page Two &middot; Verse</span>
      </header>

      <span class="kicker reveal" style="animation-delay: 0.05s">Nocturne</span>
      <h1 class="display reveal" style="animation-delay: 0.1s">
        For the <span class="ital">small hours.</span>
      </h1>

      <p class="lede lede--verse reveal" style="animation-delay: 0.2s">
        In the quiet of the night,<br />
        Stars whisper secrets bright,<br />
        Dreams take flight on silent wings,<br />
        Morning awaits what dawn will bring.
      </p>

      <hr class="rule" />
      <p class="prose reveal" style="animation-delay: 0.26s">
        Four lines, unsigned, found tucked in the margin of a train timetable.
      </p>

      <a href="index.html" class="backlink">&larr; Back to the index</a>
    </main>
  </body>
